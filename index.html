<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 19th, Shamika</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF1C2;--ink:#3A1236;--mag:#B3267D;--soft:#FFD6E8;--card:#FFFBEA;--btn:#FFF8E1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25092A;--ink:#FFE9A8;--mag:#FF7FC4;--soft:#4A1747;--card:#35103A;--btn:#25092A}}
:root[data-theme="dark"]{--bg:#25092A;--ink:#FFE9A8;--mag:#FF7FC4;--soft:#4A1747;--card:#35103A;--btn:#25092A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2{font-family:"Bagel Fat One","DM Sans",system-ui,sans-serif;font-weight:400;line-height:1.05;margin:.4em 0 .3em;color:var(--mag)}
h1{font-size:clamp(40px,12vw,58px)}h2{font-size:clamp(30px,9vw,42px)}
.s{display:none;max-width:460px;margin:0 auto;padding:20px 16px 36px;text-align:center}
.s.on{display:block}
.btn{font:600 17px "DM Sans",system-ui,sans-serif;background:var(--mag);color:var(--btn);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;margin-top:12px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pol{background:#fff;padding:10px 10px 34px;box-shadow:0 8px 24px rgba(58,18,54,.28);transform:rotate(-3deg);width:78%;margin:12px auto}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 25%}
.hud{display:flex;justify-content:space-between;font-weight:600;margin:6px 4px}
#cv{display:block;margin:0 auto;background:var(--soft);border-radius:20px;touch-action:none}
#note{min-height:1.5em;color:var(--mag);font-weight:600}
.opt{display:block;width:100%;text-align:left;font:600 17px "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--mag);border-radius:16px;padding:14px 16px;margin:10px 0;cursor:pointer}
.opt.ok{background:var(--mag);color:var(--btn)}
.opt.no{opacity:.45;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.opt.no{animation:none}}
#bal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.bal{aspect-ratio:4/5;border:0;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;cursor:pointer;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);transition:transform .15s}
.bal:hover{transform:translateY(-4px)}
.bal:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bal.gone{visibility:hidden}
#wish{min-height:4.5em;color:var(--mag);font-weight:600;font-size:19px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0}
.row .pol{width:46%;margin:6px 0}
.row .pol:nth-child(2){transform:rotate(3deg)}.row .pol:nth-child(3){transform:rotate(-1.5deg)}
.msg{text-align:left;background:var(--card);border-radius:20px;padding:6px 20px;margin:14px 0}
.from{font-family:"Bagel Fat One","DM Sans",sans-serif;color:var(--mag);font-size:24px;margin:6px 0 0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style></head><body>

<script>
const CFG={goal:12,from:"With love, from someone who’s glad you exist",
msg:["Another year of you walking into a room and making it brighter. Nineteen suits you.",
"May this year bring more golden-hour lights, more laughing with your eyes shut, and everything you’ve been quietly working toward.",
"Make it loud. Make it yours. Eat the cake first."],
wishes:["Your laugh is the loudest good thing in any room.","You make ordinary evenings feel like fairy-light lanes.","Nineteen is lucky to have you.","May this year be 90% cake.","Keep the dramatic hand-on-head poses coming.","Wish big. You’ve got this."]};
const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id===id));scrollTo(0,0)}
// confetti
const cf=$('#cf'),cc=cf.getContext('2d');let ps=[],run=false;
const COL=['#B3267D','#FF7FC4','#FFD84D','#FFF1C2','#7A2F72'];
function fit(){cf.width=innerWidth;cf.height=innerHeight}fit();addEventListener('resize',fit);
function burst(k){const n=k||(matchMedia('(prefers-reduced-motion:reduce)').matches?30:140);
for(let i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:COL[i%5],a:Math.random()*6});
if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cc.clearRect(0,0,cf.width,cf.height);
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cc.fillStyle=p.c;cc.save();cc.translate(p.x,p.y);cc.rotate(p.a);cc.fillRect(-p.r,-p.r/2,p.r*2,p.r);cc.restore()});
ps=ps.filter(p=>p.y<cf.height+20);if(ps.length)requestAnimationFrame(tick);else run=false}
// game
const cv=$('#cv'),cx=cv.getContext('2d'),face=$('#face');
let W,H,dpr,px,items,score,live,last,nextT;
function size(){dpr=devicePixelRatio||1;W=Math.min(innerWidth-32,420);H=Math.round(W*1.2);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(dpr,0,0,dpr,0,0)}
function start(){show('game');size();px=W/2;items=[];score=0;live=true;last=0;nextT=0;$('#note').textContent='';$('#sc').textContent='Cakes 0 / '+CFG.goal;requestAnimationFrame(loop)}
function move(e){const r=cv.getBoundingClientRect();px=Math.max(34,Math.min(W-34,e.clientX-r.left))}
cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
addEventListener('keydown',e=>{if(!live)return;if(e.key==='ArrowLeft')px=Math.max(34,px-30);if(e.key==='ArrowRight')px=Math.min(W-34,px+30)});
function loop(t){if(!live)return;const dt=Math.min(40,t-(last||t));last=t;
if(t>nextT){nextT=t+Math.max(380,780-score*25);const bad=Math.random()<.2;items.push({x:Math.random()*(W-50)+25,y:-20,bad,e:bad?'🥦':['🍰','🧁','🎂'][Math.random()*3|0],v:.18+Math.random()*.08+score*.008})}
cx.clearRect(0,0,W,H);cx.font='34px serif';cx.textAlign='center';cx.textBaseline='middle';
const cy=H-48;
items.forEach(it=>{it.y+=it.v*dt;cx.fillText(it.e,it.x,it.y)});
items=items.filter(it=>{if(Math.hypot(it.x-px,it.y-cy)<48){score=Math.max(0,score+(it.bad?-1:1));$('#note').textContent=it.bad?'Broccoli! −1':'Yum! +1';$('#sc').textContent='Cakes '+score+' / '+CFG.goal;return false}return it.y<H+30});
cx.save();cx.beginPath();cx.arc(px,cy,36,0,7);cx.clip();
if(face.complete&&face.naturalWidth)cx.drawImage(face,px-36,cy-36,72,72);else cx.fillText('🙂',px,cy);
cx.restore();cx.lineWidth=4;cx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--mag')||'#B3267D';cx.beginPath();cx.arc(px,cy,36,0,7);cx.stroke();
if(score>=CFG.goal){live=false;$('#note').textContent='You did it!';burst();setTimeout(()=>{show('pop');initPop()},1200);return}
requestAnimationFrame(loop)}
// balloons
const BC=['#B3267D','#FF7FC4','#FFD84D','#7A2F72','#F08A4B','#5BB5A2'];
let popped=0;
function initPop(){popped=0;$('#wish').textContent='Tap a balloon.';$('#openmsg').hidden=true;const b=$('#bal');b.innerHTML='';
CFG.wishes.forEach((w,i)=>{const el=document.createElement('button');el.className='bal';el.style.background=BC[i%BC.length];el.setAttribute('aria-label','Balloon '+(i+1));
el.onclick=()=>{el.classList.add('gone');el.disabled=true;$('#wish').textContent=w;burst(25);if(++popped===CFG.wishes.length)$('#openmsg').hidden=false};
b.appendChild(el)})}
$('#openmsg').onclick=finish;
function finish(){$('#msg').innerHTML=CFG.msg.map(m=>'<p>'+m+'</p>').join('');$('#from').textContent=CFG.from;show('end');burst();setTimeout(burst,500)}
$('#go').onclick=start;$('#again').onclick=()=>show('intro');
addEventListener('resize',()=>{if($('#game').classList.contains('on')){size()}});
</script></body></html>
